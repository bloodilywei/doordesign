<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>門片模擬系統 - 專業版</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    
    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        window.FB = { initializeApp, getApps, getApp, getAuth, signInAnonymously, getFirestore, collection, getDocs };
    </script>

    <style>
        body { background-color: #f8fafc; font-family: -apple-system, sans-serif; overflow-x: hidden; touch-action: manipulation; }
        .canvas-bg { background-image: linear-gradient(45deg, #e5e7eb 25%, transparent 25%), linear-gradient(-45deg, #e5e7eb 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e5e7eb 75%), linear-gradient(-45deg, transparent 75%, #e5e7eb 75%); background-size: 16px 16px; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .tab-content { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .toast-enter { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideDown { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const CanvasBox = React.memo(() => {
            return (
                <div id="canvas-container-wrapper" className="absolute inset-0 w-full h-full">
                    <canvas id="main-canvas"></canvas>
                </div>
            );
        }, () => true); 

        const MY_FIREBASE_CONFIG = {
            apiKey: "AIzaSyD-I3XsPn77h4Vp6SYgZ5vhOZsovJBkhJk",
            authDomain: "artifacts-732a0.firebaseapp.com",
            projectId: "artifacts-732a0",
            storageBucket: "artifacts-732a0.firebasestorage.app",
            messagingSenderId: "235490784097",
            appId: "1:235490784097:web:d12b0ab9745da6c8510b20"
        };

        const CONFIG = {
            series: { "1": "梧桐木紋", "2": "鋸痕木紋", "3": "節眼木紋", "5": "石紋系列", "6": "潮流木紋" },
            colors: {
                "1": { name: "白梣木", hex: "#F2F0E6" }, "2": { name: "秋香", hex: "#A9A9A9" }, 
                "3": { name: "柚木", hex: "#966F33" }, "5": { name: "深胡桃", hex: "#3E2723" },
                "6": { name: "淺黃梧桐", hex: "#F5DEB3" }, "7": { name: "黃梧桐", hex: "#E2B37B" },
                "8": { name: "摩卡", hex: "#4B3621" }, "9": { name: "灰橡", hex: "#8E8E8E" }
            },
            lineColors: { "G": { name: "灰線", hex: "#9ca3af" }, "B": { name: "黑線", hex: "#000000" }, "W": { name: "白線", hex: "#ffffff" } },
            glassFrames: [ { id: "GLS_G-01_467×725", name: "玻璃框 G-01" }, { id: "GLS_T_08_200×605", name: "玻璃框 T-08" }, { id: "GLS_T_09_370×605", name: "玻璃框 T-09" }, { id: "GLS_T_16_200×200", name: "玻璃框 T-16" }, { id: "GLS_T_17_250×950", name: "玻璃框 T-17" } ],
            louvers: [ { id: "LOU_A-03_378×230", name: "百頁 A-03" }, { id: "LOU_A-04_200×650", name: "百頁 A-04" }, { id: "LOU_A-05_400×650", name: "百頁 A-05" }, { id: "LOU_A-13_250×297", name: "百頁 A-13" } ],
            accColors: [ { id: "白", name: "白色", hex: "#FFFFFF" }, { id: "柚木", name: "柚木色", hex: "#966F33" }, { id: "胡桃", name: "胡桃色", hex: "#5D4037" } ],
            potentialDesigns: Array.from({length: 999}, (_, i) => (i + 1).toString().padStart(2, '0'))
        };

        const App = () => {
            const [isAuthorized, setIsAuthorized] = useState(false);
            const [authKey, setAuthKey] = useState('');
            const [authError, setAuthError] = useState('');
            
            const [activeMenu, setActiveMenu] = useState(window.innerWidth < 768 ? null : 'designs'); 
            const [selection, setSelection] = useState({ design: '01', file: '', lineColor: '' });
            const [fabricCanvas, setFabricCanvas] = useState(null);
            const [selectedAcc, setSelectedAcc] = useState(null);
            const [doorScale, setDoorScale] = useState(1);
            
            const [cloudFiles, setCloudFiles] = useState({ doors: [], lines: [] });
            const [isCloudFiltered, setIsCloudFiltered] = useState(false); 
            const [isScanning, setIsScanning] = useState(false);
            const [toastMsg, setToastMsg] = useState('');
            
            const [localValidFiles, setLocalValidFiles] = useState({ doors: new Set(), lines: new Set() });
            const [isLocalScanning, setIsLocalScanning] = useState(false);
            const [accTab, setAccTab] = useState('glass'); 
            
            const canvasContainerRef = useRef(null);
            const isLocalEnv = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

            const validDesigns = useMemo(() => {
                const allDesigns = [...CONFIG.potentialDesigns].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
                if (!isCloudFiltered || cloudFiles.doors.length === 0) return allDesigns; 
                
                const validSet = new Set();
                const seriesKeys = Object.keys(CONFIG.series);
                const allDesignsByLength = [...allDesigns].sort((a, b) => b.length - a.length);
                
                cloudFiles.doors.forEach(file => {
                    const lowerFile = file.toLowerCase();
                    const match = lowerFile.match(/^([a-z0-9]+)[-_]/);
                    if (match) {
                        const designPart = match[1];
                        const foundDesign = allDesigns.find(d => d.toLowerCase() === designPart);
                        if (foundDesign) {
                            validSet.add(foundDesign);
                            return; 
                        }
                    }
                    for (const d of allDesignsByLength) {
                        const dLower = d.toLowerCase();
                        if (lowerFile.startsWith(dLower)) {
                            const remainder = lowerFile.substring(dLower.length);
                            const nextChar = remainder.charAt(0);
                            if (seriesKeys.includes(nextChar) || nextChar === '-' || nextChar === '.' || /^[a-c]$/i.test(nextChar)) {
                                validSet.add(d);
                                break; 
                            }
                        }
                    }
                });
                return allDesigns.filter(d => validSet.has(d));
            }, [isCloudFiltered, cloudFiles]);

            const filesForCurrentDesign = useMemo(() => {
                if (!selection.design) return [];
                const sourceFiles = isCloudFiltered ? cloudFiles.doors : Array.from(localValidFiles.doors);
                const dLower = selection.design.toLowerCase();
                
                return sourceFiles.filter(f => {
                    const lowerFile = f.toLowerCase();
                    if (lowerFile.startsWith(dLower + '-') || lowerFile.startsWith(dLower + '_')) return true;
                    if (lowerFile.startsWith(dLower)) {
                        const remainder = lowerFile.substring(dLower.length);
                        const nextChar = remainder.charAt(0);
                        if (Object.keys(CONFIG.series).includes(nextChar)) return true;
                    }
                    return false;
                });
            }, [isCloudFiltered, cloudFiles.doors, localValidFiles.doors, selection.design]);

            const specialOptions = useMemo(() => {
                return filesForCurrentDesign.filter(f => {
                    const noExt = f.toLowerCase().replace(/\.(jpg|png)$/, '');
                    let isStandard = false;
                    for (const tId of Object.keys(CONFIG.series)) {
                        for (const cId of Object.keys(CONFIG.colors)) {
                            const baseOld = `${selection.design}${tId}${cId}`.toLowerCase();
                            const baseNew = `${selection.design}-${tId}${cId}`.toLowerCase();
                            if (noExt === baseOld || noExt === baseNew) {
                                isStandard = true;
                                break;
                            }
                        }
                        if (isStandard) break;
                    }
                    return !isStandard; 
                });
            }, [filesForCurrentDesign, selection.design]);

            const handleCheckKey = async () => {
                if (!authKey) return;
                setAuthError('驗證中...');
                try {
                    const app = FB.getApps().length === 0 ? FB.initializeApp(MY_FIREBASE_CONFIG) : FB.getApp();
                    const db = FB.getFirestore(app);
                    await FB.signInAnonymously(FB.getAuth(app));
                    const snapshot = await FB.getDocs(FB.collection(db, 'artifacts', 'default-app-id', 'public', 'data', 'access_keys'));
                    const matched = snapshot.docs.map(d=>d.data()).find(k=>k.key===authKey.toUpperCase());
                    
                    if (matched && new Date(matched.expiresAt) > new Date()) {
                        setIsAuthorized(true);
                    } else setAuthError("密碼錯誤或已過期");
                } catch (e) { setAuthError("連線失敗，請檢查網路"); }
            };

            const fetchRepoTree = async (forceRefresh = false) => {
                setIsScanning(true);
                const cacheKey = 'github_repo_tree_v18'; 
                const cacheTimeKey = 'github_repo_tree_time_v18';
                
                try {
                    if (isLocalEnv) {
                        setIsCloudFiltered(false);
                        setIsScanning(false);
                        return;
                    }

                    const cached = localStorage.getItem(cacheKey);
                    const cachedTime = localStorage.getItem(cacheTimeKey);
                    if (!forceRefresh && cached && cachedTime && (Date.now() - parseInt(cachedTime) < 86400000)) {
                        setCloudFiles(JSON.parse(cached));
                        setIsCloudFiltered(true);
                        setIsScanning(false);
                        return;
                    }

                    let owner = 'bloodilywei'; 
                    let repo = 'bloodilywei.github.io';
                    if (window.location.hostname.includes('.github.io')) {
                        owner = window.location.hostname.split('.')[0];
                        const pathParts = window.location.pathname.split('/').filter(Boolean);
                        repo = pathParts.length > 0 ? pathParts[0] : window.location.hostname;
                    }

                    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/main?recursive=1`);
                    if (res.ok) {
                        const data = await res.json();
                        const doors = [];
                        const lines = [];
                        data.tree.forEach(item => {
                            if (item.path.toLowerCase().startsWith('doors/')) doors.push(item.path.split('/')[1]);
                            if (item.path.toLowerCase().startsWith('lines/')) lines.push(item.path.split('/')[1]);
                        });
                        const filesObj = { doors, lines };
                        setCloudFiles(filesObj);
                        setIsCloudFiltered(true);
                        localStorage.setItem(cacheKey, JSON.stringify(filesObj));
                        localStorage.setItem(cacheTimeKey, Date.now().toString());
                        if (forceRefresh) {
                            setToastMsg('圖庫目錄已成功更新！');
                            setTimeout(() => setToastMsg(''), 3000);
                        }
                    } else {
                        if (cached) {
                            setCloudFiles(JSON.parse(cached));
                            setIsCloudFiltered(true);
                            setToastMsg('API 連線受限，已恢復使用暫存目錄');
                            setTimeout(() => setToastMsg(''), 4000);
                        } else setIsCloudFiltered(false);
                    }
                } catch (e) {
                    const cached = localStorage.getItem(cacheKey);
                    if (cached) {
                        setCloudFiles(JSON.parse(cached));
                        setIsCloudFiltered(true);
                    } else setIsCloudFiltered(false);
                } finally {
                    setIsScanning(false);
                }
            };

            useEffect(() => {
                if (!isAuthorized) return;
                fetchRepoTree();
            }, [isAuthorized]);

            const handleRefreshCache = () => {
                fetchRepoTree(true); 
            };

            useEffect(() => {
                if (!isAuthorized || isCloudFiltered || !selection.design) return;
                
                const scanLocalFallback = async () => {
                    setIsLocalScanning(true);
                    const foundDoors = new Set();
                    const foundLines = new Set();
                    
                    const check = async (folder, file) => {
                        try {
                            const res = await fetch(`${folder}/${file}?t=${Date.now()}`, { method: 'HEAD' });
                            const contentType = res.headers.get('content-type') || '';
                            if (res.ok && contentType.includes('image')) {
                                if (folder === 'doors') foundDoors.add(file);
                                else foundLines.add(file);
                            } 
                            else {
                                const ext = file.split('.').pop();
                                if (ext === 'jpg' || ext === 'png') {
                                    const upper = file.slice(0, -ext.length) + ext.toUpperCase();
                                    const r2 = await fetch(`${folder}/${upper}?t=${Date.now()}`, { method: 'HEAD' });
                                    const ct2 = r2.headers.get('content-type') || '';
                                    if (r2.ok && ct2.includes('image')) {
                                        if (folder === 'doors') foundDoors.add(upper);
                                        else foundLines.add(upper);
                                    }
                                }
                            }
                        } catch(e) {}
                    };

                    const tasks = [];
                    Object.keys(CONFIG.series).forEach(tId => {
                        Object.keys(CONFIG.colors).forEach(cId => {
                            tasks.push(() => check('doors', `${selection.design}-${tId}${cId}.jpg`));
                            tasks.push(() => check('doors', `${selection.design}-${tId}${cId}.png`));
                            tasks.push(() => check('doors', `${selection.design}${tId}${cId}.jpg`));
                            tasks.push(() => check('doors', `${selection.design}${tId}${cId}.png`));
                            
                            ["-01", "-02", "-03", "-04", "-05", "A", "B", "C", "-A", "-B", "-C"].forEach(s => {
                                const sWithDash = s.startsWith('-') ? s : `-${s}`;
                                tasks.push(() => check('doors', `${selection.design}-${tId}${cId}${sWithDash}.jpg`));
                                tasks.push(() => check('doors', `${selection.design}-${tId}${cId}${sWithDash}.png`));
                                tasks.push(() => check('doors', `${selection.design}${tId}${cId}${s}.jpg`));
                            });
                        });
                    });
                    Object.keys(CONFIG.lineColors).forEach(lc => {
                        tasks.push(() => check('lines', `${selection.design}_${lc}.png`));
                        tasks.push(() => check('lines', `${selection.design}-${lc}.png`));
                    });

                    const CHUNK_SIZE = 15;
                    for (let i = 0; i < tasks.length; i += CHUNK_SIZE) {
                        const chunk = tasks.slice(i, i + CHUNK_SIZE);
                        await Promise.all(chunk.map(t => t()));
                        await new Promise(r => setTimeout(r, 30));
                    }
                    
                    setLocalValidFiles({ doors: foundDoors, lines: foundLines });
                    setIsLocalScanning(false);
                };
                scanLocalFallback();
            }, [selection.design, isCloudFiltered, isAuthorized]);

            const hasLineFile = (filename) => {
                const lower = filename.toLowerCase();
                if (isCloudFiltered) return cloudFiles.lines.some(f => f.toLowerCase() === lower);
                return Array.from(localValidFiles.lines).some(f => f.toLowerCase() === lower);
            };

            useEffect(() => {
                if (filesForCurrentDesign.length > 0) {
                    const currentLower = (selection.file || '').toLowerCase();
                    const isCurrentValid = filesForCurrentDesign.some(f => f.toLowerCase() === currentLower);
                    if (!isCurrentValid) {
                        setSelection(prev => ({ ...prev, file: filesForCurrentDesign[0] }));
                    }
                }
            }, [filesForCurrentDesign, selection.file]);

            const loadImageSafe = (url) => {
                return new Promise((resolve, reject) => {
                    const img = new window.Image();
                    if (!isLocalEnv) img.crossOrigin = 'anonymous'; 
                    img.onload = () => resolve(img);
                    img.onerror = () => reject(new Error(`無法載入圖片: ${url}`));
                    img.src = url;
                });
            };

            useEffect(() => {
                if (!isAuthorized || !canvasContainerRef.current) return;
                if (!fabricCanvas) {
                    const canvas = new fabric.Canvas('main-canvas', { 
                        width: canvasContainerRef.current.clientWidth || window.innerWidth * 0.6, 
                        height: canvasContainerRef.current.clientHeight || window.innerHeight, 
                        backgroundColor: 'transparent',
                        preserveObjectStacking: true 
                    });
                    canvas.on('selection:created', (e) => {
                        if (e.selected && e.selected[0] && e.selected[0].id?.startsWith('acc')) { setSelectedAcc(e.selected[0]); setActiveMenu('acc'); }
                    });
                    canvas.on('selection:updated', (e) => {
                        if (e.selected && e.selected[0] && e.selected[0].id?.startsWith('acc')) { setSelectedAcc(e.selected[0]); setActiveMenu('acc'); }
                    });
                    canvas.on('selection:cleared', () => setSelectedAcc(null));
                    setFabricCanvas(canvas);
                    return;
                }

                const handleResize = () => {
                    const container = document.getElementById('canvas-container-wrapper');
                    if (fabricCanvas && container) {
                        let cw = container.clientWidth || 800;
                        let ch = container.clientHeight || 600;
                        fabricCanvas.setWidth(cw);
                        fabricCanvas.setHeight(ch);
                        
                        const door = fabricCanvas.getObjects().find(o => o.id === 'door');
                        if (door && door.width) {
                            const newScale = Math.min((cw * 0.95) / door.width, (ch * 0.95) / door.height);
                            setDoorScale(newScale);
                            door.set({ scaleX: newScale, scaleY: newScale, left: cw/2, top: ch/2 });
                            const line = fabricCanvas.getObjects().find(o => o.id === 'lineLayer');
                            if (line && line.width) line.set({ scaleX: (door.width * newScale) / line.width, scaleY: (door.height * newScale) / line.height, left: cw / 2, top: ch / 2 });
                            fabricCanvas.getObjects().forEach(obj => {
                                if (obj.id?.startsWith('acc')) { obj.set({ scaleX: newScale, scaleY: newScale }); obj.setCoords(); }
                            });
                            fabricCanvas.requestRenderAll();
                        }
                    }
                };
                window.addEventListener('resize', handleResize);
                const timer = setTimeout(handleResize, 310);
                return () => { window.removeEventListener('resize', handleResize); clearTimeout(timer); };
            }, [isAuthorized, fabricCanvas, activeMenu]);

            // ★ 無殘影繪圖引擎：徹底解決非同步疊圖 (Race Condition) 問題
            useEffect(() => {
                if (!fabricCanvas || !selection.file) return;
                
                let isCancelled = false; // 攔截非同步請求的標記

                const container = document.getElementById('canvas-container-wrapper');
                const cw = container?.clientWidth || 800;
                const ch = container?.clientHeight || 600;
                fabricCanvas.setWidth(cw);
                fabricCanvas.setHeight(ch);

                const actualDoorFile = selection.file.replace('doors/', '');
                
                const drawCanvas = async () => {
                    try {
                        // 1. 操作剛開始，立刻先把舊圖瞬間清空！確保畫面乾淨不重疊
                        fabricCanvas.getObjects().forEach(obj => {
                            if (['door', 'lineLayer', 'errorText', 'errorBg'].includes(obj.id)) fabricCanvas.remove(obj);
                        });
                        fabricCanvas.requestRenderAll();

                        // 2. 開始下載新圖 (這需要花一點時間)
                        const doorHtmlImg = await loadImageSafe(`doors/${actualDoorFile}`);
                        
                        // 3. ★ 核心防護：如果在這段等待時間內，使用者又點了別的按鈕，這個舊指令就直接作廢！
                        if (isCancelled) return;
                        
                        // 保險起見，貼上新圖前再清一次
                        fabricCanvas.getObjects().forEach(obj => {
                            if (['door', 'lineLayer', 'errorText', 'errorBg'].includes(obj.id)) fabricCanvas.remove(obj);
                        });

                        const doorImg = new fabric.Image(doorHtmlImg);
                        const newScale = Math.min((cw * 0.95) / doorImg.width, (ch * 0.95) / doorImg.height);
                        setDoorScale(newScale);

                        doorImg.set({ 
                            scaleX: newScale, scaleY: newScale, selectable: false, id: 'door', evented: false, 
                            originX: 'center', originY: 'center', left: cw / 2, top: ch / 2 
                        });
                        fabricCanvas.add(doorImg).sendToBack(doorImg);

                        if (selection.lineColor) {
                            const targetOld = `${selection.design}_${selection.lineColor}.png`.toLowerCase();
                            const targetNew = `${selection.design}-${selection.lineColor}.png`.toLowerCase();
                            let targetLineFile = `${selection.design}_${selection.lineColor}.png`; 
                            
                            const sourceLines = isCloudFiltered ? cloudFiles.lines : Array.from(localValidFiles.lines);
                            const exactLineMatch = sourceLines.find(f => {
                                const lower = f.toLowerCase();
                                return lower === targetOld || lower === targetNew;
                            });
                            if (exactLineMatch) targetLineFile = exactLineMatch;
                            
                            try {
                                const lineHtmlImg = await loadImageSafe(`lines/${targetLineFile}`);
                                if (isCancelled) return; // 下載線條期間如果被切換也作廢
                                
                                const lineImg = new fabric.Image(lineHtmlImg);
                                lineImg.set({ 
                                    scaleX: (doorImg.width * newScale) / lineImg.width, 
                                    scaleY: (doorImg.height * newScale) / lineImg.height, 
                                    selectable: false, id: 'lineLayer', evented: false, 
                                    originX: 'center', originY: 'center', left: cw / 2, top: ch / 2 
                                });
                                fabricCanvas.add(lineImg);
                                lineImg.moveTo(1); 
                            } catch (err) {}
                        }
                        fabricCanvas.requestRenderAll();

                    } catch (error) {
                        if (isCancelled) return; // 發生錯誤時如果被切換也作廢
                        
                        const errorBg = new fabric.Rect({
                            id: 'errorBg', left: cw / 2, top: ch / 2, originX: 'center', originY: 'center',
                            width: 320, height: 100, rx: 15, ry: 15, fill: 'rgba(255, 255, 255, 0.9)',
                            stroke: '#ef4444', strokeWidth: 3, selectable: false, evented: false
                        });

                        const errorText = new fabric.Text(`⚠️ 尚未上傳圖檔\n${actualDoorFile}`, {
                            id: 'errorText', left: cw / 2, top: ch / 2, originX: 'center', originY: 'center',
                            fontSize: 18, fontWeight: 'bold', fill: '#ef4444', textAlign: 'center', selectable: false, evented: false
                        });
                        
                        fabricCanvas.add(errorBg, errorText);
                        fabricCanvas.requestRenderAll();
                    }
                };

                drawCanvas();
                
                // 清理函數：當 selection 改變，立刻將 isCancelled 設為 true 攔截舊請求
                return () => { isCancelled = true; };
            }, [selection, fabricCanvas, isCloudFiltered, cloudFiles, localValidFiles]);

            const handleDownload = () => {
                if (!fabricCanvas) return;
                const link = document.createElement('a');
                const fileName = `CY_${selection.design}_${selection.file.split('.')[0]}_${selection.lineColor || '原色'}.png`;
                link.download = fileName;
                link.href = fabricCanvas.toDataURL({ format: 'png', multiplier: 2 });
                link.click();
            };

            // ★ 一鍵清除所有配件
            const handleClearAccessories = () => {
                if (!fabricCanvas) return;
                const accs = fabricCanvas.getObjects().filter(obj => obj.id?.startsWith('acc'));
                if (accs.length === 0) return;
                accs.forEach(acc => fabricCanvas.remove(acc));
                fabricCanvas.requestRenderAll();
                setSelectedAcc(null);
                setToastMsg('已清除所有配件');
                setTimeout(() => setToastMsg(''), 2000);
            };

            if (!isAuthorized) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center bg-slate-900 px-8 text-center">
                        <div className="w-20 h-20 bg-blue-600 rounded-3xl mb-6 flex items-center justify-center text-white text-4xl font-black italic shadow-2xl">CY</div>
                        <h2 className="text-white text-xl font-bold mb-8 tracking-widest uppercase">系統授權訪問</h2>
                        <input type="text" value={authKey} onChange={(e)=>setAuthKey(e.target.value)} onKeyDown={(e)=>e.key==='Enter'&&handleCheckKey()} placeholder="輸入授權金鑰" className="w-full max-w-sm p-4 bg-slate-800 border border-slate-700 rounded-xl text-center text-white mb-3 outline-none focus:border-blue-500 uppercase tracking-widest font-bold" />
                        {authError && <p className="text-rose-500 text-xs font-bold mb-4">{authError}</p>}
                        <button onClick={handleCheckKey} className="w-full max-w-sm py-4 bg-blue-600 text-white rounded-xl font-black shadow-xl active:scale-95 transition-all uppercase tracking-widest">登入系統</button>
                    </div>
                );
            }

            return (
                <div className="flex flex-col md:flex-row h-screen w-screen bg-slate-50 font-sans overflow-hidden relative">
                    
                    {toastMsg && (
                        <div className="absolute top-16 left-1/2 -translate-x-1/2 bg-rose-600 text-white px-6 py-3 rounded-full text-xs font-black shadow-2xl z-50 toast-enter flex items-center gap-2 border-2 border-rose-400">
                            <span>⚠️</span> {toastMsg}
                        </div>
                    )}

                    <div className={`
                        absolute md:relative top-0 left-0 h-[calc(100vh-5rem)] md:h-full 
                        w-[45%] md:w-80 bg-white border-r border-slate-200 z-20 shadow-2xl md:shadow-none 
                        transition-all duration-300 flex flex-col shrink-0
                        ${activeMenu ? 'ml-0' : '-ml-[45%] md:ml-0'}
                    `}>
                        <div className="hidden md:flex h-14 bg-slate-50 border-b border-slate-200 shrink-0">
                            <button onClick={()=>setActiveMenu('designs')} className={`flex-1 flex flex-col items-center justify-center transition-colors ${activeMenu==='designs'?'bg-white text-blue-600 border-b-2 border-blue-600':'text-slate-400 hover:bg-slate-100'}`}><span className="text-[12px] font-black">造型</span></button>
                            <button onClick={()=>setActiveMenu('colors')} className={`flex-1 flex flex-col items-center justify-center transition-colors ${activeMenu==='colors'?'bg-white text-blue-600 border-b-2 border-blue-600':'text-slate-400 hover:bg-slate-100'}`}><span className="text-[12px] font-black">顏色</span></button>
                            <button onClick={()=>setActiveMenu('acc')} className={`flex-1 flex flex-col items-center justify-center transition-colors ${activeMenu==='acc'?'bg-white text-blue-600 border-b-2 border-blue-600':'text-slate-400 hover:bg-slate-100'}`}><span className="text-[12px] font-black">配件</span></button>
                        </div>
                        <div className="md:hidden flex h-12 bg-blue-50 border-b border-blue-100 items-center justify-between px-4 shrink-0">
                            <span className="text-xs font-black text-blue-600 uppercase">{activeMenu === 'designs' ? '選擇造型' : activeMenu === 'colors' ? '板材/線條' : '配件飾面'}</span>
                            <button onClick={()=>setActiveMenu(null)} className="text-blue-400 font-bold text-lg leading-none">×</button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-3 custom-scrollbar bg-slate-50/30 tab-content relative">
                            {(isScanning || isLocalScanning) && (
                                <div className="absolute inset-0 bg-white/80 z-10 flex flex-col items-center justify-center">
                                    <div className="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-2"></div>
                                    <span className="text-xs font-bold text-blue-600">正在處理圖庫目錄...</span>
                                </div>
                            )}
                            
                            {activeMenu === 'designs' && (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                    {validDesigns.length === 0 && !isScanning && !isLocalScanning && (
                                        <div className="col-span-full text-center py-10 text-[10px] text-slate-400 font-bold border-2 border-dashed border-slate-200 rounded-xl mx-2">尚未掃描到任何圖檔</div>
                                    )}
                                    {validDesigns.map(id => (
                                        <button key={id} onClick={()=>{
                                            setSelection({...selection, design:id}); 
                                            setActiveMenu('colors'); 
                                        }} className={`py-3 border-2 rounded-xl text-[11px] font-black transition-all ${selection.design===id?'border-blue-500 bg-blue-50 text-blue-600 shadow-sm':'border-slate-200 bg-white hover:border-blue-200 text-slate-600'}`}>
                                            {id}
                                        </button>
                                    ))}
                                </div>
                            )}

                            {activeMenu === 'colors' && (
                                <div className="flex flex-col gap-6 pb-6">
                                    <div className="bg-white p-3 rounded-xl shadow-sm border border-slate-100">
                                        <p className="text-[10px] font-black text-slate-400 mb-2 border-l-2 border-blue-400 pl-1 uppercase">線條顏色</p>
                                        <div className="grid grid-cols-1 gap-2">
                                            <button onClick={()=>setSelection({...selection, lineColor:''})} className={`p-2 border-2 rounded-lg flex flex-col items-center gap-1 ${selection.lineColor===''?'border-blue-500 bg-blue-50':'border-slate-100'}`}>
                                                <div className="w-full h-1.5 bg-slate-200 rounded-full"></div><span className="text-[9px] font-bold text-slate-600">原樣</span>
                                            </button>
                                            {Object.entries(CONFIG.lineColors).map(([lc, d]) => {
                                                if (!hasLineFile(`${selection.design}_${lc}.png`) && !hasLineFile(`${selection.design}-${lc}.png`)) return null;
                                                return (
                                                    <button key={lc} onClick={()=>setSelection({...selection, lineColor:lc})} className={`p-2 border-2 rounded-lg flex flex-col items-center gap-1 ${selection.lineColor===lc?'border-blue-500 bg-blue-50':'border-slate-100'}`}>
                                                        <div className="w-full h-1.5 rounded-full border border-slate-200" style={{backgroundColor: d.hex}}></div><span className="text-[9px] font-bold text-slate-600">{d.name}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                    
                                    {Object.entries(CONFIG.series).map(([tId, tName]) => {
                                        const seriesColors = Object.entries(CONFIG.colors).filter(([cId]) => {
                                            const baseOld = `${selection.design}${tId}${cId}`.toLowerCase();
                                            const baseNew = `${selection.design}-${tId}${cId}`.toLowerCase();
                                            return filesForCurrentDesign.some(f => {
                                                const lower = f.toLowerCase();
                                                return lower.startsWith(baseOld) || lower.startsWith(baseNew);
                                            });
                                        });
                                        if (seriesColors.length === 0) return null;

                                        return (
                                            <div key={tId}>
                                                <p className="text-[10px] font-black text-slate-500 mb-2 border-l-2 border-slate-300 pl-1 uppercase">{tName}</p>
                                                <div className="grid grid-cols-2 gap-2">
                                                    {seriesColors.map(([cId, c]) => {
                                                        const baseOld = `${selection.design}${tId}${cId}`.toLowerCase();
                                                        const baseNew = `${selection.design}-${tId}${cId}`.toLowerCase();
                                                        
                                                        let exactFile = filesForCurrentDesign.find(f => {
                                                            const noExt = f.toLowerCase().replace(/\.(jpg|png)$/, '');
                                                            return noExt === baseOld || noExt === baseNew;
                                                        });
                                                        
                                                        if (!exactFile) {
                                                            exactFile = filesForCurrentDesign.find(f => {
                                                                const lower = f.toLowerCase();
                                                                return lower.startsWith(baseOld) || lower.startsWith(baseNew);
                                                            });
                                                        }
                                                        if (!exactFile) exactFile = `${selection.design}-${tId}${cId}.jpg`;

                                                        return (
                                                            <button key={cId} onClick={()=>setSelection({...selection, file:exactFile})} className={`p-2 border-2 rounded-xl flex flex-col items-center gap-1 transition-all bg-white ${selection.file===exactFile?'border-rose-500 shadow-md ring-2 ring-rose-50':'border-slate-100 hover:border-slate-300'}`}>
                                                                <div className="w-full aspect-square rounded-lg shadow-inner border border-slate-100" style={{backgroundColor: c.hex}}></div>
                                                                <span className="text-[9px] font-black text-slate-600 truncate w-full text-center leading-none mt-1">{c.name}</span>
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })}

                                    {specialOptions.length > 0 && (
                                        <div className="border-t border-slate-200 pt-4 mt-2">
                                            <p className="text-[10px] font-black text-amber-600 mb-2 border-l-2 border-amber-400 pl-1 uppercase">特殊組合跳色</p>
                                            <div className="flex flex-col gap-2">
                                                {specialOptions.map(f => (
                                                    <button key={f} onClick={()=>setSelection({...selection, file:f})} className={`p-3 border-2 rounded-xl text-[10px] font-black transition-all bg-white ${selection.file===f?'border-amber-500 bg-amber-50 text-amber-700 shadow-sm':'border-slate-200 text-slate-600 hover:border-amber-200'}`}>
                                                        {f.split('.')[0]}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {activeMenu === 'acc' && (
                                <div className="flex flex-col gap-4 pb-6">
                                    {!selectedAcc ? (
                                        <>
                                            {/* ★ 新增：一鍵清除所有配件按鈕 */}
                                            <button onClick={handleClearAccessories} className="w-full py-2 bg-rose-50 text-rose-500 rounded-lg border border-rose-200 text-[10px] font-black hover:bg-rose-100 active:scale-95 transition-all flex items-center justify-center gap-1 shadow-sm">
                                                🗑️ 一鍵清除所有配件
                                            </button>

                                            <div className="bg-emerald-50 text-emerald-600 text-[10px] font-bold p-3 rounded-lg border border-emerald-100 mb-2 text-center">點擊加入畫布，或點選畫布上配件編輯</div>
                                            
                                            <div className="flex gap-2 mb-2">
                                                <button onClick={() => setAccTab('glass')} className={`flex-1 py-2 text-[10px] font-black rounded-lg border-2 transition-all ${accTab === 'glass' ? 'border-blue-500 bg-blue-50 text-blue-600 shadow-sm' : 'border-slate-200 bg-white text-slate-500 hover:bg-slate-50'}`}>
                                                    玻璃框
                                                </button>
                                                <button onClick={() => setAccTab('louver')} className={`flex-1 py-2 text-[10px] font-black rounded-lg border-2 transition-all ${accTab === 'louver' ? 'border-blue-500 bg-blue-50 text-blue-600 shadow-sm' : 'border-slate-200 bg-white text-slate-500 hover:bg-slate-50'}`}>
                                                    百頁
                                                </button>
                                            </div>

                                            {(accTab === 'glass' ? CONFIG.glassFrames : CONFIG.louvers).map(acc => (
                                                <button key={acc.id} onClick={async ()=>{
                                                    try {
                                                        const accHtmlImg = await loadImageSafe(`accessories/${acc.id}_白.png`);
                                                        const img = new fabric.Image(accHtmlImg);
                                                        img.set({ 
                                                            left: fabricCanvas.getWidth()/2, top: fabricCanvas.getHeight()/2, 
                                                            originX: 'center', originY: 'center', 
                                                            id: `acc-${Date.now()}`, baseId: acc.id, currentColor: "白", 
                                                            scaleX: doorScale, scaleY: doorScale, 
                                                            hasControls: false, lockScalingX: true, lockScalingY: true, 
                                                            hasBorders: true, cornerColor: '#3b82f6', transparentCorners: false
                                                        });
                                                        fabricCanvas.add(img).setActiveObject(img).requestRenderAll();
                                                        setActiveMenu('acc'); 
                                                    } catch (err) {
                                                        setToastMsg(`找不到配件：${acc.id}_白.png`);
                                                        setTimeout(() => setToastMsg(''), 3000);
                                                    }
                                                }} className="p-3 bg-white rounded-xl border-2 border-slate-200 flex items-center gap-3 active:scale-95 transition-transform hover:border-blue-300">
                                                    <div className="w-8 h-8 bg-blue-50 text-blue-500 rounded flex items-center justify-center font-black shadow-sm">+</div>
                                                    <span className="text-[10px] font-black text-slate-700">{acc.name}</span>
                                                </button>
                                            ))}
                                        </>
                                    ) : (
                                        <div className="bg-white p-3 rounded-xl border-2 border-blue-200 shadow-sm animate-in fade-in slide-in-from-top-2">
                                            <p className="text-[9px] text-blue-500 font-black mb-1 uppercase tracking-widest">正在編輯配件</p>
                                            <p className="text-xs font-black text-slate-800 mb-4 truncate">{selectedAcc.baseId}</p>
                                            
                                            <button onClick={()=>{
                                                fabricCanvas.remove(selectedAcc); 
                                                fabricCanvas.requestRenderAll(); 
                                                setSelectedAcc(null);
                                            }} className="w-full py-3 bg-rose-500 text-white rounded-lg font-black text-[11px] shadow-md active:bg-rose-600 active:scale-95 transition-all mb-5 flex items-center justify-center gap-2">
                                                🗑️ 刪除此配件
                                            </button>

                                            <p className="text-[10px] font-black text-slate-400 mb-2 border-l-2 border-slate-200 pl-1 uppercase">飾面顏色更換</p>
                                            <div className="grid grid-cols-2 gap-2">
                                                {CONFIG.accColors.map(c => (
                                                    <button key={c.id} onClick={async ()=>{
                                                        try {
                                                            const newHtmlImg = await loadImageSafe(`accessories/${selectedAcc.baseId}_${c.id}.png`);
                                                            const newImg = new fabric.Image(newHtmlImg);
                                                            newImg.set({ 
                                                                left: selectedAcc.left, top: selectedAcc.top, 
                                                                scaleX: selectedAcc.scaleX, scaleY: selectedAcc.scaleY, 
                                                                id: selectedAcc.id, baseId: selectedAcc.baseId, currentColor: c.id, 
                                                                hasControls: false, lockScalingX: true, lockScalingY: true, 
                                                                hasBorders: true, cornerColor: '#3b82f6', transparentCorners: false
                                                            });
                                                            fabricCanvas.remove(selectedAcc).add(newImg).setActiveObject(newImg).requestRenderAll();
                                                            setSelectedAcc(newImg);
                                                        } catch(err) {
                                                            setToastMsg(`找不到配件顏色：${selectedAcc.baseId}_${c.id}.png`);
                                                            setTimeout(() => setToastMsg(''), 3000);
                                                        }
                                                    }} className={`p-2 border-2 rounded-lg flex flex-col items-center gap-1 ${selectedAcc.currentColor===c.id?'border-blue-500 bg-blue-50':'border-slate-100 hover:bg-slate-50'}`}>
                                                        <div className="w-6 h-6 rounded-full border shadow-inner" style={{backgroundColor: c.hex}}></div>
                                                        <span className="text-[9px] font-black text-slate-600">{c.name}</span>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col relative h-[calc(100vh-5rem)] md:h-full min-w-0">
                        <div className="h-14 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-4 z-10 shrink-0 shadow-sm">
                            <div className="flex flex-col">
                                <span className="text-[9px] font-black text-slate-400 tracking-widest uppercase">Model Preview</span>
                                <span className="text-[11px] font-black text-slate-800">
                                    {selection.design} {selection.lineColor ? `(${CONFIG.lineColors[selection.lineColor].name})` : ''}
                                </span>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={handleRefreshCache} className="bg-slate-100 text-slate-600 px-3 py-2.5 rounded-xl text-[12px] font-black shadow-sm hover:bg-slate-200 active:scale-95 transition-all">
                                    🔄 刷新目錄
                                </button>
                                <button onClick={handleDownload} className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-5 py-2.5 rounded-xl text-[12px] font-black tracking-widest shadow-[0_4px_15px_rgba(59,130,246,0.4)] hover:shadow-[0_6px_20px_rgba(59,130,246,0.6)] hover:-translate-y-0.5 active:scale-95 transition-all uppercase hidden md:flex items-center gap-2 border border-blue-400">
                                    📥 儲存圖檔
                                </button>
                            </div>
                        </div>

                        <div className="flex-1 canvas-bg relative w-full h-full min-h-[300px]" ref={canvasContainerRef}>
                            <CanvasBox />
                        </div>
                    </div>

                    <div className="md:hidden absolute bottom-0 left-0 w-full h-20 bg-white border-t flex items-center justify-around z-30 shadow-[0_-5px_20px_rgba(0,0,0,0.05)] pb-4 px-2">
                        <button onClick={()=>setActiveMenu(activeMenu==='designs'?null:'designs')} className={`nav-btn flex flex-col items-center justify-center flex-1 h-full gap-1 ${activeMenu==='designs'?'text-blue-600':'text-slate-400'}`}>
                            <div className="text-xl">🔲</div><span className="text-[10px] font-black uppercase tracking-widest">選造型</span>
                        </button>
                        <button onClick={()=>setActiveMenu(activeMenu==='colors'?null:'colors')} className={`nav-btn flex flex-col items-center justify-center flex-1 h-full gap-1 ${activeMenu==='colors'?'text-blue-600':'text-slate-400'}`}>
                            <div className="text-xl">🎨</div><span className="text-[10px] font-black uppercase tracking-widest">板材色</span>
                        </button>
                        <button onClick={()=>setActiveMenu(activeMenu==='acc'?null:'acc')} className={`nav-btn flex flex-col items-center justify-center flex-1 h-full gap-1 ${activeMenu==='acc'?'text-blue-600':'text-slate-400'}`}>
                            <div className="text-xl">⚙️</div><span className="text-[10px] font-black uppercase tracking-widest">加配件</span>
                        </button>
                        <button onClick={handleDownload} className="nav-btn flex flex-col items-center justify-center flex-1 h-full gap-1 text-indigo-500 hover:text-indigo-700 active:scale-95 transition-transform">
                            <div className="text-xl">📥</div><span className="text-[10px] font-black uppercase tracking-widest">儲存圖檔</span>
                        </button>
                    </div>

                </div>
            );
        };

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, errMsg: '' }; }
            static getDerivedStateFromError(error) { return { hasError: true, errMsg: error.message }; }
            render() {
                if (this.state.hasError) return <div className="p-8 text-rose-600 font-bold bg-rose-50 h-screen w-screen">系統崩潰保護：<br/>{this.state.errMsg}</div>;
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
