<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>門片模擬系統 - 手機優化版</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    
    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        window.FB = { initializeApp, getApps, getApp, getAuth, signInAnonymously, getFirestore, collection, getDocs };
    </script>

    <style>
        body { background-color: #f1f5f9; font-family: -apple-system, sans-serif; overflow: hidden; touch-action: none; }
        .canvas-bg { background-image: linear-gradient(45deg, #e5e7eb 25%, transparent 25%), linear-gradient(-45deg, #e5e7eb 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e5e7eb 75%), linear-gradient(-45deg, transparent 75%, #e5e7eb 75%); background-size: 15px 15px; }
        .custom-scrollbar::-webkit-scrollbar { display: none; }
        
        /* 手機底部選單動畫 */
        .drawer { transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .drawer.active { transform: translateY(0); }

        /* 防止手機點擊時的藍色高亮 */
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const MY_FIREBASE_CONFIG = {
            apiKey: "AIzaSyD-I3XsPn77h4Vp6SYgZ5vhOZsovJBkhJk",
            authDomain: "artifacts-732a0.firebaseapp.com",
            projectId: "artifacts-732a0",
            storageBucket: "artifacts-732a0.firebasestorage.app",
            messagingSenderId: "235490784097",
            appId: "1:235490784097:web:d12b0ab9745da6c8510b20"
        };

        const CONFIG = {
            series: { "1": "梧桐木紋", "2": "鋸痕木紋", "3": "節眼木紋", "5": "石紋系列", "6": "潮流木紋" },
            colors: {
                "1": { name: "白梣木", hex: "#F2F0E6" }, "2": { name: "秋香", hex: "#A9A9A9" }, 
                "3": { name: "柚木", hex: "#966F33" }, "5": { name: "深胡桃", hex: "#3E2723" },
                "6": { name: "淺黃梧桐", hex: "#F5DEB3" }, "7": { name: "黃梧桐", hex: "#E2B37B" },
                "8": { name: "摩卡", hex: "#4B3621" }, "9": { name: "灰橡", hex: "#8E8E8E" }
            },
            lineColors: { "G": { name: "灰線", hex: "#9ca3af" }, "B": { name: "黑線", hex: "#000000" } },
            // 直接指定型號清單，避免掃描幾百次造成的流量卡死
            designs: ["110", "120", "122", "123", "125", "126", "141", "144", "150", "306", "790", "802", "01", "02", "04", "11"]
        };

        const App = () => {
            const [isAuthorized, setIsAuthorized] = useState(false);
            const [activeMenu, setActiveMenu] = useState(null); // 'designs', 'colors', 'acc'
            const [selection, setSelection] = useState({ design: '01', file: '0111.jpg', lineColor: '' });
            const [fabricCanvas, setFabricCanvas] = useState(null);
            const [authKey, setAuthKey] = useState('');
            const [isSyncing, setIsSyncing] = useState(false);

            // 1. 權限檢查 (輕量化)
            const checkKey = async (key) => {
                const targetKey = key || authKey;
                if (!targetKey) return;
                try {
                    const app = FB.getApps().length === 0 ? FB.initializeApp(MY_FIREBASE_CONFIG) : FB.getApp();
                    const db = FB.getFirestore(app);
                    await FB.signInAnonymously(FB.getAuth(app));
                    const snapshot = await FB.getDocs(FB.collection(db, 'artifacts', 'default-app-id', 'public', 'data', 'access_keys'));
                    const matched = snapshot.docs.map(d=>d.data()).find(k=>k.key===targetKey.toUpperCase());
                    if (matched && new Date(matched.expiresAt) > new Date()) {
                        setIsAuthorized(true);
                        localStorage.setItem('cached_key', matched.key);
                    } else alert("密碼錯誤或已過期");
                } catch (e) { alert("連線失敗"); }
            };

            useEffect(() => {
                const saved = localStorage.getItem('cached_key');
                if (saved) checkKey(saved);
            }, []);

            // 2. 畫布初始化 (自動符合螢幕)
            useEffect(() => {
                if (!isAuthorized) return;
                const canvas = new fabric.Canvas('main-canvas', { 
                    width: window.innerWidth, 
                    height: window.innerHeight - 120, // 扣除底部選單
                    backgroundColor: 'transparent',
                    preserveObjectStacking: true 
                });
                setFabricCanvas(canvas);
                return () => canvas.dispose();
            }, [isAuthorized]);

            // 3. 圖片載入 (直接顯示，不預掃描)
            useEffect(() => {
                if (!fabricCanvas || !selection.file) return;
                const pureFile = selection.file.replace('doors/', '');
                fabric.Image.fromURL(`doors/${pureFile}`, (doorImg) => {
                    if (!doorImg) return;
                    const existing = fabricCanvas.getObjects().find(o => o.id === 'door');
                    if (existing) fabricCanvas.remove(existing);

                    // 手機版自動縮放：以寬度 85% 或高度 75% 為準
                    const scale = Math.min((window.innerWidth * 0.85) / doorImg.width, (window.innerHeight * 0.7) / doorImg.height);
                    doorImg.set({ scaleX: scale, scaleY: scale, selectable: false, id: 'door', evented: false, originX: 'center', originY: 'center', left: window.innerWidth/2, top: (window.innerHeight - 150)/2 });
                    fabricCanvas.add(doorImg).sendToBack(doorImg);

                    // 線條層同步
                    const linePath = `lines/${selection.design}_${selection.lineColor}.png`;
                    const existingLine = fabricCanvas.getObjects().find(o => o.id === 'lineLayer');
                    if (existingLine) fabricCanvas.remove(existingLine);

                    if (selection.lineColor) {
                        fabric.Image.fromURL(linePath, (lineImg) => {
                            if (lineImg) {
                                lineImg.set({ scaleX: (doorImg.getScaledWidth()) / lineImg.width, scaleY: (doorImg.getScaledHeight()) / lineImg.height, selectable: false, id: 'lineLayer', evented: false, originX: 'center', originY: 'center', left: doorImg.left, top: doorImg.top });
                                fabricCanvas.add(lineImg);
                                lineImg.moveTo(1);
                            }
                            fabricCanvas.requestRenderAll();
                        });
                    }
                    fabricCanvas.requestRenderAll();
                });
            }, [selection, fabricCanvas]);

            if (!isAuthorized) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center bg-slate-900 px-10 text-center">
                        <div className="w-20 h-20 bg-blue-600 rounded-3xl mb-8 flex items-center justify-center text-white text-4xl font-black italic">CY</div>
                        <h2 className="text-white text-xl font-bold mb-6 tracking-widest uppercase">彩燿專業門片模擬</h2>
                        <input type="text" value={authKey} onChange={(e)=>setAuthKey(e.target.value)} placeholder="請輸入金鑰" className="w-full p-4 bg-slate-800 border border-slate-700 rounded-2xl text-center text-white mb-4 outline-none focus:border-blue-500 transition-all" />
                        <button onClick={()=>checkKey()} className="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-xl active:scale-95 transition-all">啟動系統</button>
                    </div>
                );
            }

            return (
                <div className="h-screen w-screen flex flex-col bg-slate-50 relative overflow-hidden">
                    {/* 頂部資訊 */}
                    <div className="h-12 flex items-center justify-between px-4 bg-white/80 backdrop-blur-md border-b text-[11px] font-bold text-slate-400 z-10">
                        <span>型號: {selection.design}</span>
                        <button onClick={() => {
                            const link = document.createElement('a');
                            link.download = `Door.png`;
                            link.href = fabricCanvas.toDataURL({ format: 'png', multiplier: 2 });
                            link.click();
                        }} className="text-blue-600">保存圖片</button>
                    </div>

                    {/* 主體畫布 */}
                    <div className="flex-1 canvas-bg flex items-center justify-center relative">
                        <canvas id="main-canvas"></canvas>
                    </div>

                    {/* 底部導航欄 */}
                    <div className="h-20 bg-white border-t flex items-center justify-around px-2 z-30">
                        <button onClick={()=>setActiveMenu(activeMenu==='designs'?null:'designs')} className={`flex flex-col items-center gap-1 ${activeMenu==='designs'?'text-blue-600':'text-slate-400'}`}>
                            <div className="w-6 h-6 border-2 border-current rounded-sm"></div><span className="text-[10px] font-bold">選造型</span>
                        </button>
                        <button onClick={()=>setActiveMenu(activeMenu==='colors'?null:'colors')} className={`flex flex-col items-center gap-1 ${activeMenu==='colors'?'text-blue-600':'text-slate-400'}`}>
                            <div className="w-6 h-6 bg-current rounded-full"></div><span className="text-[10px] font-bold">選板材</span>
                        </button>
                        <button onClick={()=>setActiveMenu(activeMenu==='lines'?null:'lines')} className={`flex flex-col items-center gap-1 ${activeMenu==='lines'?'text-blue-600':'text-slate-400'}`}>
                            <div className="w-6 h-6 border-b-2 border-r-2 border-current"></div><span className="text-[10px] font-bold">選線條</span>
                        </button>
                        <button onClick={()=>{localStorage.clear(); window.location.reload();}} className="flex flex-col items-center gap-1 text-slate-300">
                            <div className="text-lg">×</div><span className="text-[10px]">登出</span>
                        </button>
                    </div>

                    {/* 彈出選單內容 (Drawer) */}
                    <div className={`drawer fixed bottom-20 left-0 w-full max-h-[50vh] bg-white rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.1)] p-5 z-40 overflow-y-auto custom-scrollbar ${activeMenu?'active':''}`}>
                        <div className="w-12 h-1 bg-slate-200 rounded-full mx-auto mb-4"></div>
                        
                        {activeMenu === 'designs' && (
                            <div className="grid grid-cols-3 gap-3">
                                {CONFIG.designs.map(id => (
                                    <button key={id} onClick={()=>{setSelection({...selection, design:id, file:`${id}11.jpg`}); setActiveMenu(null);}} 
                                        className={`p-3 border-2 rounded-xl text-xs font-bold ${selection.design===id?'border-blue-500 bg-blue-50 text-blue-600':'border-slate-50'}`}>造型 {id}</button>
                                ))}
                            </div>
                        )}

                        {activeMenu === 'colors' && (
                            <div className="flex flex-col gap-6">
                                {Object.entries(CONFIG.series).map(([tId, tName]) => (
                                    <div key={tId}>
                                        <p className="text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-widest">{tName}</p>
                                        <div className="grid grid-cols-4 gap-2">
                                            {Object.entries(CONFIG.colors).map(([cId, c]) => (
                                                <button key={cId} onClick={()=>{setSelection({...selection, file:`${selection.design}${tId}${cId}.jpg`}); setActiveMenu(null);}} className="flex flex-col items-center gap-1">
                                                    <div className="w-full aspect-square rounded-lg border shadow-sm" style={{backgroundColor: c.hex}}></div>
                                                    <span className="text-[9px] text-slate-500 truncate w-full text-center">{c.name}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeMenu === 'lines' && (
                            <div className="grid grid-cols-3 gap-3">
                                <button onClick={()=>{setSelection({...selection, lineColor:''}); setActiveMenu(null);}} className="p-4 border-2 rounded-xl text-xs font-bold border-slate-50">無線條</button>
                                {Object.entries(CONFIG.lineColors).map(([lc, d]) => (
                                    <button key={lc} onClick={()=>{setSelection({...selection, lineColor:lc}); setActiveMenu(null);}} className="p-4 border-2 rounded-xl text-xs font-bold border-slate-50">
                                        <div className="w-full h-1 mb-2" style={{backgroundColor: d.hex}}></div>{d.name}
                                    </button>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* 遮罩 */}
                    {activeMenu && <div onClick={()=>setActiveMenu(null)} className="fixed inset-0 bg-black/20 z-20"></div>}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
