<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>門片模擬系統 - 旗艦版</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
    <script>
        window.FB = {
            initializeApp: (config) => firebase.initializeApp(config),
            getApps: () => firebase.apps,
            getApp: () => firebase.app(),
            getAuth: (app) => firebase.auth(app),
            signInAnonymously: (auth) => auth.signInAnonymously(),
            getFirestore: (app) => firebase.firestore(app),
            collection: (db, ...segments) => db.collection(segments.join('/')),
            getDocs: async (ref) => {
                const snapshot = await ref.get();
                return {
                    docs: snapshot.docs.map((doc) => ({
                        id: doc.id,
                        data: () => doc.data()
                    }))
                };
            }
        };
    </script>

    <style>
        body { background-color: #f8fafc; font-family: -apple-system, sans-serif; overflow-x: hidden; touch-action: manipulation; }
        .canvas-bg { background-image: linear-gradient(45deg, #e5e7eb 25%, transparent 25%), linear-gradient(-45deg, #e5e7eb 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e5e7eb 75%), linear-gradient(-45deg, transparent 75%, #e5e7eb 75%); background-size: 16px 16px; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .tab-content { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .toast-enter { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideDown { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="app.compiled.js?v=20260624c"></script>
</body>
</html>
