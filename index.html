<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>門片樣式配置模擬器 - 專業授權版</title>
    <!-- 核心函式庫 -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    
    <!-- Firebase 核心 (新增防重複載入機制) -->
    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        window.FB = { initializeApp, getApps, getApp, getAuth, signInAnonymously, getFirestore, collection, getDocs };
    </script>

    <style>
        body { background-color: #f1f5f9; font-family: -apple-system, sans-serif; overflow: hidden; }
        .canvas-bg { background-image: linear-gradient(45deg, #e5e7eb 25%, transparent 25%), linear-gradient(-45deg, #e5e7eb 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e5e7eb 75%), linear-gradient(-45deg, transparent 75%, #e5e7eb 75%); background-size: 20px 20px; }
        .viewport-container { display: flex; align-items: flex-start; justify-content: center; flex: 1; overflow: auto; background-color: #e2e8f0; padding: 40px; }
        .canvas-wrapper { background-color: white; padding: 8px; border-radius: 4px; box-shadow: 0 40px 80px -15px rgba(0,0,0,0.2); width: 376px; height: 736px; flex-shrink: 0; }
        .login-anim { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .sync-indicator { animation: spin 2s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // ==========================================================
        // ★ 您的 Firebase Config (已根據截圖填入) ★
        // ==========================================================
        const MY_FIREBASE_CONFIG = {
            apiKey: "AIzaSyD-I3XsPn77h4Vp6SYgZ5vhOZsovJBkhJk",
            authDomain: "artifacts-732a0.firebaseapp.com",
            projectId: "artifacts-732a0",
            storageBucket: "artifacts-732a0.firebasestorage.app",
            messagingSenderId: "235490784097",
            appId: "1:235490784097:web:d12b0ab9745da6c8510b20"
        };
        // ==========================================================

        const CONFIG = {
            series: { "1": "梧桐木紋", "2": "鋸痕木紋", "3": "節眼木紋", "5": "石紋系列", "6": "潮流木紋" },
            colors: {
                "1": { name: "白梣木", hex: "#F2F0E6" }, "2": { name: "秋香", hex: "#A9A9A9" }, 
                "3": { name: "柚木", hex: "#966F33" }, "5": { name: "深胡桃", hex: "#3E2723" },
                "6": { name: "淺黃梧桐", hex: "#F5DEB3" }, "7": { name: "黃梧桐", hex: "#E2B37B" },
                "8": { name: "摩卡", hex: "#4B3621" }, "9": { name: "灰橡/大理石", hex: "#8E8E8E" }
            },
            lineColors: { "G": { name: "灰線", hex: "#9ca3af" }, "B": { name: "黑線", hex: "#000000" }, "W": { name: "白線", hex: "#ffffff" } },
            potentialDesigns: ["110", "120", "122", "123", "125", "126", "141", "144", "150", "151", "152", "153", "305", "306", "307", "308", "309", "401", "501", "502", "503", "504", "601", "602", "605", "650", "651", "751", "752", "755", "760", "761", "762", "763", "764", "765", "780", "790", "791", "802", "880", "900", "01", "02", "04", "07", "08", "11", "14", "15", "16", "20", "30", "50", "51", "54", "58", "60", "61", "62", "63", "64", "65", "75", "76", "78", "79", "80", "87", "88", "90", "95", "100", "200", "201"],
            specialSuffixes: ["-01", "-02", "-03", "-05", "G"],
            glassFrames: [ { id: "GLS_G-01_467×725", name: "玻璃框 G-01" }, { id: "GLS_T_08_200×605", name: "玻璃框 T-08" }, { id: "GLS_T_09_370×605", name: "玻璃框 T-09" }, { id: "GLS_T_16_200×200", name: "玻璃框 T-16" }, { id: "GLS_T_17_250×950", name: "玻璃框 T-17" } ],
            louvers: [ { id: "LOU_A-03_378×230", name: "百頁 A-03" }, { id: "LOU_A-04_200×650", name: "百頁 A-04" }, { id: "LOU_A-05_400×650", name: "百頁 A-05" }, { id: "LOU_A-13_250×297", name: "百頁 A-13" } ],
            accColors: [ { id: "白", name: "白色", hex: "#FFFFFF" }, { id: "柚木", name: "柚木色", hex: "#966F33" }, { id: "胡桃", name: "胡桃色", hex: "#5D4037" } ]
        };

        const App = () => {
            // ★ 補回了這個遺失的變數 ★
            const [activeTab, setActiveTab] = useState('styles'); 
            
            const [isAuthorized, setIsAuthorized] = useState(false);
            const [authError, setAuthError] = useState('');
            const [inputKey, setInputKey] = useState('');
            const [availableFiles, setAvailableFiles] = useState(new Set());
            const [isSyncing, setIsSyncing] = useState(true);
            const [selection, setSelection] = useState({ design: '01', file: '0111.jpg', lineColor: '' });
            const [fabricCanvas, setFabricCanvas] = useState(null);
            const [doorScale, setDoorScale] = useState(1);
            const [selectedAcc, setSelectedAcc] = useState(null);

            const checkKey = async (key) => {
                if (!key) return;
                setAuthError('連線驗證中...');
                try {
                    if (!window.FB) throw new Error("Firebase 系統尚未完全載入，請稍後再試。");
                    
                    // 防重複載入機制
                    const app = FB.getApps().length === 0 ? FB.initializeApp(MY_FIREBASE_CONFIG) : FB.getApp();
                    const db = FB.getFirestore(app);
                    const auth = FB.getAuth(app);
                    await FB.signInAnonymously(auth);

                    const snapshot = await FB.getDocs(FB.collection(db, 'artifacts', 'default-app-id', 'public', 'data', 'access_keys'));
                    const keys = snapshot.docs.map(d => d.data());
                    const matched = keys.find(k => k.key === key.trim().toUpperCase());

                    if (matched) {
                        const expiry = new Date(matched.expiresAt);
                        if (expiry > new Date()) {
                            setIsAuthorized(true);
                            localStorage.setItem('cached_door_key', matched.key);
                            startScanning();
                        } else { setAuthError('此金鑰已過期。'); }
                    } else { setAuthError('無效金鑰，請確認輸入是否正確。'); }
                } catch (e) { 
                    console.error("Firebase Error:", e);
                    setAuthError('雲端連線失敗，請檢查網路或確認已開啟資料庫讀取權限。'); 
                }
            };

            const startScanning = async () => {
                const found = new Set();
                const list = [];
                CONFIG.potentialDesigns.forEach(d => {
                    Object.keys(CONFIG.series).forEach(t => {
                        Object.keys(CONFIG.colors).forEach(c => {
                            list.push({ f: 'doors', n: `${d}${t}${c}.jpg` });
                            CONFIG.specialSuffixes.forEach(s => list.push({ f: 'doors', n: `${d}${t}${c}${s}.jpg` }));
                        });
                    });
                    Object.keys(CONFIG.lineColors).forEach(lc => list.push({ f: 'lines', n: `${d}_${lc}.png` }));
                });

                const batchSize = 60;
                for (let i = 0; i < list.length; i += batchSize) {
                    const batch = list.slice(i, i + batchSize);
                    await Promise.all(batch.map(async (item) => {
                        try {
                            const res = await fetch(`${item.f}/${item.n}`, { method: 'HEAD' });
                            if (res.ok) found.add(`${item.f}/${item.n}`);
                        } catch (e) {}
                    }));
                    // 更新狀態以刷新介面
                    setAvailableFiles(new Set(found));
                }
                setIsSyncing(false);
            };

            useEffect(() => {
                const saved = localStorage.getItem('cached_door_key');
                if (saved) checkKey(saved);
            }, []);

            // 初始化畫布
            useEffect(() => {
                if (!isAuthorized) return;
                // 此時畫布 DOM 已經被 dangerouslySetInnerHTML 保護，React 不會再干擾
                const canvas = new fabric.Canvas('main-canvas', { width: 360, height: 720, backgroundColor: 'transparent', preserveObjectStacking: true });
                const updateSelection = () => setSelectedAcc(canvas.getActiveObject()?.id.startsWith('acc') ? canvas.getActiveObject() : null);
                canvas.on('selection:created', updateSelection);
                canvas.on('selection:updated', updateSelection);
                canvas.on('selection:cleared', () => setSelectedAcc(null));
                setFabricCanvas(canvas);
                return () => canvas.dispose();
            }, [isAuthorized]);

            // 處理圖檔更新
            useEffect(() => {
                if (!fabricCanvas || !selection.file) return;
                const pureFile = selection.file.replace('doors/', '');
                fabric.Image.fromURL(`doors/${pureFile}`, (doorImg) => {
                    if (!doorImg || !doorImg._element) return;
                    const existingDoor = fabricCanvas.getObjects().find(o => o.id === 'door');
                    if (existingDoor) fabricCanvas.remove(existingDoor);

                    const scale = Math.min(320 / doorImg.width, 640 / doorImg.height);
                    setDoorScale(scale);
                    doorImg.set({ scaleX: scale, scaleY: scale, selectable: false, id: 'door', evented: false, originX: 'center', originY: 'top', left: 180, top: 40 });
                    fabricCanvas.add(doorImg).sendToBack(doorImg);

                    const lineFile = `lines/${selection.design}_${selection.lineColor}.png`;
                    const existingLine = fabricCanvas.getObjects().find(o => o.id === 'lineLayer');
                    if (existingLine) fabricCanvas.remove(existingLine);

                    if (selection.lineColor && availableFiles.has(lineFile)) {
                        fabric.Image.fromURL(lineFile, (lineImg) => {
                            lineImg.set({ scaleX: (doorImg.getScaledWidth()) / lineImg.width, scaleY: (doorImg.getScaledHeight()) / lineImg.height, selectable: false, id: 'lineLayer', evented: false, originX: 'center', originY: 'top', left: 180, top: 40 });
                            fabricCanvas.add(lineImg);
                            lineImg.moveTo(1);
                            fabricCanvas.requestRenderAll();
                        });
                    }
                    fabricCanvas.getObjects().forEach(o => { if(o.id.startsWith('acc')) o.set({ scaleX: scale, scaleY: scale }); });
                    fabricCanvas.requestRenderAll();
                }, { crossOrigin: 'anonymous' });
            }, [selection, fabricCanvas, availableFiles]);

            const designs = useMemo(() => {
                const ds = new Set();
                availableFiles.forEach(p => {
                    const f = p.split('/').pop();
                    const d = CONFIG.potentialDesigns.find(id => f.startsWith(id));
                    if (d) ds.add(d);
                });
                return Array.from(ds).sort((a,b) => a.localeCompare(b, undefined, {numeric: true}));
            }, [availableFiles]);

            if (!isAuthorized) {
                return (
                    <div className="h-screen flex items-center justify-center bg-slate-900 px-6 font-sans text-center">
                        <div className="login-anim w-full max-w-sm bg-white rounded-3xl shadow-2xl p-10">
                            <div className="w-16 h-16 bg-blue-600 rounded-2xl mx-auto mb-6 flex items-center justify-center text-white text-2xl font-black italic shadow-lg">CY</div>
                            <h2 className="text-xl font-black text-slate-800 mb-8 uppercase tracking-widest italic">系統授權訪問</h2>
                            <div className="space-y-4">
                                <input type="text" value={inputKey} onChange={(e)=>setInputKey(e.target.value)} onKeyDown={(e)=>e.key==='Enter'&&checkKey(inputKey)} placeholder="請輸入訪問金鑰" className="w-full px-4 py-4 bg-slate-50 border-2 border-slate-100 rounded-xl text-center font-bold outline-none focus:border-blue-500 transition-all uppercase" />
                                {authError && <p className="text-rose-500 text-xs font-bold italic">{authError}</p>}
                                <button onClick={()=>checkKey(inputKey)} className="w-full py-4 bg-slate-900 text-white rounded-xl font-black hover:bg-blue-600 transition-all shadow-xl uppercase">啟動模擬系統</button>
                            </div>
                            <p className="mt-8 text-[10px] text-slate-300 font-bold uppercase italic">Dealer Authorization Required</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen overflow-hidden text-slate-700 bg-slate-50 font-sans text-sm font-medium">
                    <aside className="w-64 bg-white border-r flex flex-col shadow-2xl z-20">
                        <div className="flex border-b text-[10px] font-black shrink-0">
                            <button onClick={()=>setActiveTab('styles')} className={`flex-1 py-5 ${activeTab==='styles'?'text-blue-600 border-b-2 border-blue-600':'text-slate-400'}`}>門造型款式</button>
                            <button onClick={()=>setActiveTab('glass')} className={`flex-1 py-5 ${activeTab==='glass'?'text-blue-600 border-b-2 border-blue-600':'text-slate-400'}`}>配件飾面</button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 custom-scrollbar">
                            {activeTab==='styles' ? (
                                <div className="grid grid-cols-2 gap-2">
                                    {designs.map(id => (
                                        <button key={id} onClick={()=>{
                                            const match = Array.from(availableFiles).find(f=>f.startsWith('doors/')&&f.includes(id)&&!f.includes('-'))||`${id}11.jpg`;
                                            setSelection({...selection, design:id, file:match});
                                        }} className={`p-3 border-2 rounded-xl text-[11px] font-black transition-all ${selection.design===id?'border-blue-500 bg-blue-50 text-blue-600 shadow-md':'border-slate-50 bg-white hover:border-slate-100'}`}>型號 {id}</button>
                                    ))}
                                </div>
                            ) : (
                                <div className="flex flex-col gap-2">
                                    {CONFIG.glassFrames.concat(CONFIG.louvers).map(acc => (
                                        <button key={acc.id} onClick={()=>{
                                            fabric.Image.fromURL(`accessories/${acc.id}_白.png`, (img)=>{
                                                img.set({ left: 180, top: 240, originX: 'center', originY: 'center', id: `acc-${Date.now()}`, baseId: acc.id, currentColor: "白", scaleX: doorScale, scaleY: doorScale, lockScalingX: true, lockScalingY: true, hasControls: false, hasBorders: true, cornerColor: '#3b82f6' });
                                                fabricCanvas.add(img).setActiveObject(img).renderAll();
                                            });
                                        }} className="p-3 border-2 border-slate-50 rounded-xl bg-white hover:border-blue-100 flex items-center gap-3 transition-all"><div className="w-6 h-6 bg-blue-50 rounded flex items-center justify-center text-blue-400 font-bold">+</div><span className="text-[10px] font-black truncate">{acc.name}</span></button>
                                    ))}
                                </div>
                            )}
                        </div>
                        <button onClick={()=>{localStorage.removeItem('cached_door_key');window.location.reload();}} className="p-4 text-[10px] text-slate-300 font-bold hover:text-rose-500 transition-colors uppercase">登出授權系統</button>
                    </aside>
                    <main className="flex-1 flex flex-col overflow-hidden">
                        <header className="h-16 bg-white border-b flex items-center justify-between px-8 shrink-0 z-10 shadow-sm">
                            <div className="flex items-center gap-4">
                                <span className="text-xs font-black bg-slate-100 px-4 py-2 rounded-full font-mono text-slate-500 uppercase italic">FILE: {selection.file.split('/').pop()}</span>
                                {isSyncing && <div className="flex items-center gap-2 text-[9px] text-blue-400 font-black"><div className="w-3 h-3 border-2 border-blue-400 border-t-transparent rounded-full sync-indicator"></div>雲端同步中</div>}
                            </div>
                            <button onClick={()=>{const link=document.createElement('a');link.download=`Door_Layout.png`;link.href=fabricCanvas.toDataURL({format:'png',multiplier:2});link.click();}} className="bg-blue-600 text-white px-8 py-2.5 rounded-full shadow-lg hover:bg-blue-700 transition-all text-xs font-black uppercase">輸出 PNG 圖檔</button>
                        </header>
                        <div className="flex-1 flex overflow-hidden">
                            <div className="w-72 bg-white border-r p-5 overflow-y-auto custom-scrollbar shadow-inner text-center">
                                <h3 className="text-[10px] font-black text-rose-500 mb-6 tracking-widest border-b pb-2 uppercase italic">Step 1. 材質與線條</h3>
                                <div className="mb-8 text-left">
                                    <p className="text-[10px] font-black text-blue-500 mb-3 border-l-2 border-blue-100 pl-2">線條顏色 (PNG)</p>
                                    <div className="grid grid-cols-3 gap-2">
                                        <button onClick={()=>setSelection({...selection, lineColor:''})} className={`p-2 border-2 rounded-xl text-[10px] font-bold ${selection.lineColor===''?'border-blue-500 bg-blue-50':'border-slate-50'}`}>原樣</button>
                                        {Object.entries(CONFIG.lineColors).map(([lc, data]) => {
                                            if (!availableFiles.has(`lines/${selection.design}_${lc}.png`)) return null;
                                            return <button key={lc} onClick={()=>setSelection({...selection, lineColor:lc})} className={`p-2 border-2 rounded-xl transition-all ${selection.lineColor===lc?'border-blue-500 bg-blue-50 shadow-md':'border-slate-50'}`}><div className="w-full h-3 rounded-sm mb-1 shadow-inner" style={{backgroundColor: data.hex}}></div><span className="text-[9px] font-bold">{data.name}</span></button>;
                                        })}
                                    </div>
                                </div>
                                {Object.entries(CONFIG.series).map(([tId, tName]) => (
                                    <div key={tId} className="mb-6 text-left">
                                        <p className="text-[10px] font-black text-slate-400 mb-2 border-l-2 border-slate-200 pl-2 uppercase">{tName}</p>
                                        <div className="grid grid-cols-2 gap-2">
                                            {Object.entries(CONFIG.colors).map(([cId, colorObj]) => {
                                                const fk = `doors/${selection.design}${tId}${cId}.jpg`;
                                                if (!availableFiles.has(fk)) return null;
                                                return <button key={cId} onClick={()=>setSelection({...selection, file:fk})} className={`p-2 border-2 rounded-xl transition-all ${selection.file===fk?'border-rose-500 bg-rose-50 shadow-md':'border-slate-50'}`}><div className="w-full aspect-square rounded-lg mb-2 shadow-inner" style={{backgroundColor:colorObj.hex}}></div><span className="text-[10px] font-bold leading-tight">{tId==='5'?(cId==='9'?"大理石":"清水模"):colorObj.name}</span></button>;
                                            })}
                                        </div>
                                    </div>
                                ))}
                                {Array.from(availableFiles).filter(f=>f.startsWith('doors/') && f.includes(selection.design) && f.includes('-')).length > 0 && (
                                    <div className="mt-8 pt-4 border-t">
                                        <p className="text-[10px] font-bold text-amber-600 mb-2 italic">組合/跳色款</p>
                                        {Array.from(availableFiles).filter(f=>f.startsWith('doors/') && f.includes(selection.design) && f.includes('-')).map(f => (
                                            <button key={f} onClick={()=>setSelection({...selection, file:f})} className={`w-full p-2 mb-2 border-2 rounded-xl text-[10px] font-black ${selection.file===f?'border-amber-500 bg-amber-50':'border-slate-50'}`}>{f.split('/').pop().replace('.jpg','')}</button>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <div className="viewport-container custom-scrollbar">
                                {/* ★ 防崩潰核心：dangerouslySetInnerHTML 確保 React 不會干擾 Canvas ★ */}
                                <div className="canvas-wrapper">
                                    <div className="canvas-bg w-full h-full overflow-hidden border border-slate-200 shadow-inner" 
                                         dangerouslySetInnerHTML={{ __html: '<canvas id="main-canvas"></canvas>' }}>
                                    </div>
                                </div>
                            </div>
                            <div className="w-64 bg-white border-l p-5 flex flex-col shrink-0 shadow-inner overflow-y-auto custom-scrollbar">
                                <h3 className="text-[10px] font-black text-emerald-600 mb-6 border-b pb-2 uppercase italic">Step 2. 配件飾面</h3>
                                {!selectedAcc ? (<div className="flex-1 flex flex-col items-center justify-center opacity-20 italic text-[10px] text-center px-4">點選畫布上的配件<br/>更換顏色</div>) : (
                                    <div className="flex flex-col gap-4">
                                        <div className="bg-emerald-50 p-3 rounded-xl border border-emerald-100 text-[11px] font-bold text-emerald-700 italic truncate font-mono uppercase">選中：{selectedAcc.baseId}</div>
                                        {CONFIG.accColors.map(color => {
                                            const accInfo = CONFIG.glassFrames.concat(CONFIG.louvers).find(a => a.id === selectedAcc.baseId);
                                            const accName = accInfo ? accInfo.name : '配件';
                                            return (
                                            <button key={color.id} onClick={()=>{
                                                fabric.Image.fromURL(`accessories/${selectedAcc.baseId}_${color.id}.png`, (newImg)=>{
                                                    newImg.set({ left: selectedAcc.left, top: selectedAcc.top, scaleX: doorScale, scaleY: doorScale, id: selectedAcc.id, baseId: selectedAcc.baseId, currentColor: color.id, lockScalingX: true, lockScalingY: true, hasControls: false, cornerColor: '#3b82f6' });
                                                    fabricCanvas.remove(selectedAcc).add(newImg).setActiveObject(newImg).renderAll();
                                                    setSelectedAcc(newImg);
                                                });
                                            }} className={`p-3 border-2 rounded-xl transition-all flex items-center gap-4 ${selectedAcc.currentColor===color.id?'border-emerald-500 bg-emerald-50 shadow-md':'border-slate-50 bg-white'}`}><div className="w-6 h-6 rounded border" style={{backgroundColor:color.hex}}></div><span className="text-[11px] font-black">{color.name}</span></button>
                                        )})}
                                        <button onClick={()=>{fabricCanvas.remove(selectedAcc); fabricCanvas.renderAll(); setSelectedAcc(null);}} className="mt-8 w-full py-3 text-[10px] font-black text-rose-500 border-2 border-rose-100 hover:bg-rose-50 rounded-xl transition-all uppercase">移除配件</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        // 全域錯誤捕捉器 (防白畫面)
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, errMsg: '' }; }
            static getDerivedStateFromError(error) { return { hasError: true, errMsg: error.message }; }
            render() {
                if (this.state.hasError) return <div className="p-10 bg-rose-50 text-rose-600 font-bold rounded-xl m-10 border-2 border-rose-200">系統發生錯誤，請截圖通知開發人員：<br/><br/>{this.state.errMsg}</div>;
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
